[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-example-quote-service"
version = "0.1.0"
description = "Service-layer validation with pico-pydantic behind a CLI booted by pico-boot"
requires-python = ">=3.11"
dependencies = [
    "pico-boot>=0.2.0",
    "pico-pydantic>=0.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "pico-testing>=0.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pico_module = "quote_service"
