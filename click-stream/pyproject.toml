[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-example-click-stream"
version = "0.1.0"
description = "Two Kafka consumer groups reading one topic independently, poison records skipped"
requires-python = ">=3.11"
dependencies = [
    "pico-boot>=0.2.0",
    "pico-kafka>=0.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "pico-testing>=0.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pico_module = "click_stream"
