name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against whatever upstream publishes now: a new SQLAlchemy or
  # Starlette release must turn this red without anyone pushing.
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:

# Every install resolves against the pico-bom release train, so what the
# examples exercise is exactly the set validated together.
env:
  PIP_CONSTRAINT: https://raw.githubusercontent.com/dperezcabrera/pico-bom/main/2026.11.txt

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        example:
          - order-service
          - api-aggregator
          - secure-notes
          - worker-invoicing
          - observability-service
          - runtime-config
          - dockerized-orders
          - quote-service
          - event-fanout
          - click-stream
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "./${{ matrix.example }}[dev]"
      - run: pytest ${{ matrix.example }}/tests -q

  compose-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smoke:
          - dockerized-orders
          - observability-service
          - event-fanout
          - click-stream
    steps:
      - uses: actions/checkout@v7
      - run: ./${{ matrix.smoke }}/smoke.sh
